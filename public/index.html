<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>株式会社木工舎</title>
  <meta name="description" content="株式会社木工舎のホームページです。" />
  <meta name="robots" content="noindex" />

  <style>
    :root {
      --bg:   #f4f2ee;
      --fg:   #14120f;
      --muted:#6b655d;
      --accent:#be7f35;

      --font: "Hiragino Sans", "Yu Gothic", YuGothic,
              "Noto Sans JP", system-ui, sans-serif;
      --font-serif: "Hiragino Mincho ProN", "Yu Mincho", YuMincho,
                    "Noto Serif JP", serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem 1.25rem;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      line-height: 1.9;
      text-align: center;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 6vw, 2.25rem);
      font-weight: 600;
      letter-spacing: .16em;
    }

    p {
      font-size: clamp(.9rem, 3.4vw, 1rem);
      color: var(--muted);
      letter-spacing: .04em;
    }

    .rule {
      width: 48px;
      height: 2px;
      background: var(--accent);
      border-radius: 1px;
    }
  </style>
</head>
<body>
  <h1>株式会社木工舎</h1>
  <div class="rule"></div>
  <p>ただいま準備中です。</p>
</body>
</html>
