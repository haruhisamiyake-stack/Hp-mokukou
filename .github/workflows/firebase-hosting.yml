name: Deploy to Firebase Hosting

# 現在の公開先は GitHub Pages のため、このワークフローは手動実行のみとする。
# Firebase へ移行する際は、下の workflow_dispatch に push トリガーを足してください。
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#
# 実行前に、リポジトリの Settings → Secrets and variables → Actions で
#   Secret   FIREBASE_SERVICE_ACCOUNT … サービスアカウントJSONの全文
#   Variable FIREBASE_PROJECT_ID      … FirebaseのプロジェクトID
# を登録しておく必要があります（未登録のまま実行すると失敗します）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
